services:
  mongodb:
    image: mongo:7
    container_name: ai-exam-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: ai-exam-backend
    restart: unless-stopped
    depends_on:
      - mongodb
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      # The Compose service name must be used from inside the backend network.
      MONGODB_URL: mongodb://mongodb:27017/
      MONGODB_DATABASE: ${MONGODB_DATABASE:-ai_examination_studio}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env before starting Compose}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-["http://localhost:4200"]}
    volumes:
      - ./backend/storage:/app/backend/storage

volumes:
  mongodb_data:
